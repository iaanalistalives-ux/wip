<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WIP Servicio &mdash; LIVES</title>
<script>
/* WIP Muestras · pantalla de Servicio (30/09/2026).
   La pantalla es una sola, index.html; esta página solo la abre en el modo de su área.
   Qué puede registrar cada persona lo decide Supabase con los permisos del portal. */
location.replace('index.html?area=servicio' + location.hash);
</script>
</head>
<body style="margin:0;background:#F1F6F4;font-family:Calibri,Arial,sans-serif;">
<p style="padding:24px;color:#5F726C;font-size:14px">Abriendo WIP Servicio&hellip;
<a href="index.html?area=servicio" style="color:#0F7A5A;font-weight:700">Si no abre, toca aquí</a>.</p>

<!-- ===== lives-actualizar v1 · 2026-10-06 · aviso de versión nueva (común a todas las herramientas).
     Revisa cada 3 minutos (y al volver a la pestaña) si el archivo publicado cambió. Si cambió,
     muestra "Hay una versión nueva · Actualizar". Nunca recarga sola: la persona decide, así no
     pierde lo que está llenando. Solo pide el encabezado del archivo (HEAD), no lo descarga. ===== -->
<style id="lsActCss">
#lsAct{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:2147483000;display:none;
  align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px);
  background:#0E3B36;color:#fff;border:2px solid #10B981;border-radius:12px;padding:10px 14px;
  box-shadow:0 8px 24px rgba(14,59,54,.30);font-family:Calibri,Arial,sans-serif;font-size:14px;line-height:1.35}
#lsAct b{font-weight:700}
#lsAct button{font-family:inherit;font-size:14px;font-weight:700;border-radius:8px;padding:8px 14px;cursor:pointer;min-height:38px}
#lsActSi{background:#10B981;color:#0E3B36;border:none}
#lsActNo{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55)}
@media print{#lsAct{display:none!important}}
</style>
<script id="lsActJs">(function(){
  'use strict';
  if (window.__lsAct) return; window.__lsAct = true;
  if (!/^https?:$/.test(location.protocol)) return;
  var url = location.origin + location.pathname, base = null, hasta = 0, mostrado = false;
  function firma(){
    return fetch(url, { method: 'HEAD', cache: 'no-store' }).then(function(r){
      if (!r.ok) return null;
      return r.headers.get('etag') || r.headers.get('last-modified') || null;
    }, function(){ return null; });
  }
  function aviso(){
    if (mostrado || Date.now() < hasta) return;
    var d = document.getElementById('lsAct');
    if (!d){
      d = document.createElement('div'); d.id = 'lsAct'; d.setAttribute('role', 'status');
      d.innerHTML = '<span><b>Hay una versión nueva de esta herramienta.</b> Guarda lo que estés haciendo y toca Actualizar.</span>' +
                    '<button id="lsActSi" type="button">Actualizar</button><button id="lsActNo" type="button">Después</button>';
      document.body.appendChild(d);
      document.getElementById('lsActSi').onclick = function(){ location.reload(); };
      document.getElementById('lsActNo').onclick = function(){ d.style.display = 'none'; mostrado = false; hasta = Date.now() + 10 * 60000; };
    }
    d.style.display = 'flex'; mostrado = true;
  }
  function revisar(){
    if (document.hidden) return;
    firma().then(function(f){
      if (!f) return;
      if (base === null){ base = f; return; }
      if (f !== base) aviso();
    });
  }
  revisar();
  setInterval(revisar, 3 * 60000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) revisar(); });
})();</script>
<!-- ===== fin lives-actualizar v1 ===== -->

<!-- ===== lives-franja v2 · 2026-10-07 · UNA sola franja de estado delgada y sin la palabra "Supabase" (común a todas las herramientas).
     1) La tira de estado de arriba ("Datos al…", "En vivo…", nombre, enlaces) y el aviso "Datos en vivo" van juntos en UNA sola línea delgada (el aviso entra a la tira, a la izquierda).
     2) En lo que se ve en pantalla no aparece el nombre del proveedor de la base: "· Supabase" y "fuente: Supabase" se quitan,
        y en los textos de ayuda "Supabase" se lee "la base de datos". El código y los datos no cambian. ===== -->
<style id="lsFrCss">
@media screen{
.lsSinBarra{padding:2px 12px 0!important;gap:2px 10px!important;font-size:12px!important;line-height:1.25!important;min-height:0!important}
.lsSinBarra>*:not(a):not(button):not(select):not(input){margin:0!important;padding-top:0!important;padding-bottom:0!important;font-size:12px!important;line-height:1.25!important;min-height:0!important}
.lsSinBarra>*:not(a):not(button) *:not(a):not(button):not(select):not(input){font-size:12px!important;line-height:1.25!important}
.lsSinBarra a,.lsSinBarra button,.lsSinBarra>* a,.lsSinBarra>* button{padding:1px 8px!important;font-size:12px!important;line-height:1.25!important;border-width:1px!important;border-radius:6px!important;min-height:0!important;height:auto!important}
.lsSinBarra select,.lsSinBarra input{padding:0 6px!important;font-size:12px!important;height:20px!important;min-height:0!important}
.lsSinBarra br{display:none}
.avisoVivo{padding:2px 10px!important;font-size:12px!important;line-height:1.3!important;margin-bottom:6px!important;border-radius:6px!important}
.avisoVivo button{padding:1px 8px!important;font-size:12px!important;min-height:0!important}
.lsSinBarra{padding:1px 12px 0!important}
.lsSinBarra>.avisoVivo{order:-1;margin:0 auto 0 0!important;padding:0 8px!important;font-size:12px!important;line-height:18px!important;border-radius:9px!important;display:inline-flex!important;align-items:center;gap:6px;flex-wrap:wrap;max-width:100%}
.lsSinBarra>.avisoVivo *{font-size:12px!important;line-height:18px!important;margin:0!important}
.lsSinBarra>.avisoVivo.ok,.lsSinBarra>.avisoVivo.ok *{color:#065F46!important}
.lsSinBarra>.avisoVivo.cargando,.lsSinBarra>.avisoVivo.cargando *{color:#92400E!important}
.lsSinBarra>.avisoVivo.error,.lsSinBarra>.avisoVivo.error *{color:#991B1B!important}
.lsSinBarra>.avisoVivo button{padding:0 8px!important;line-height:16px!important}
.lsSinBarra>.aviso{order:-1;margin:0 auto 0 0!important;padding:0 8px!important;font-size:12px!important;line-height:18px!important;border-radius:9px!important;border-width:1px!important}
body:has(.lsSinBarra) .hstate-emb{display:none!important}
}
</style>
<script id="lsFrJs">(function(){try{
  /* Saltos de línea dentro de la tira: se ven como " · " para que quede en una sola línea. */
  function tira(){Array.prototype.forEach.call(document.querySelectorAll('.lsSinBarra br'),function(b){
    var p=b.previousSibling,n=b.nextSibling;
    if(p&&p.nodeType===3&&/·\s*$/.test(p.nodeValue))return; if(n&&n.nodeType===3&&/^\s*·/.test(n.nodeValue))return;
    b.parentNode.insertBefore(document.createTextNode(' · '),b);});}
  /* Una sola línea: el aviso "Datos en vivo / Cargando / error" entra a la tira de arriba. */
  function unir(){var s=document.querySelector('.lsSinBarra'),a=document.querySelector('#avisoVivo,.avisoVivo');
    if(s&&a&&a.parentNode!==s&&!a.closest('[data-ls-sin-barra]'))s.insertBefore(a,s.firstChild);
    var c=document.querySelector('.wrap>.aviso');if(s&&c&&/solo para consultar/i.test(c.textContent))s.insertBefore(c,s.firstChild);}
  /* Sin "Supabase" en lo visible. */
  var R=[[/\s*[·|,-]\s*fuente\s*:\s*Supabase\b/gi,''],[/\bfuente\s*:\s*Supabase\b\s*/gi,'Fuente: base de datos LIVES '],
         [/\s*[·|]\s*Supabase\b/g,''],[/\bSupabase\s*[·|]\s*/g,''],[/\s*\(\s*Supabase\s*\)/gi,''],
         [/\b(en|a|de|desde|con)\s+Supabase\b/gi,'$1 la base de datos'],[/\bSupabase\b/gi,'la base de datos']];
  function limpia(t){var x=t;R.forEach(function(r){x=x.replace(r[0],r[1]);});return x.replace(/de la la base/gi,'de la base').replace(/en la la base/gi,'en la base');}
  var SKIP=/^(SCRIPT|STYLE|NOSCRIPT|TEXTAREA|CODE|PRE)$/;
  function nodo(n){if(n.nodeValue&&/upabase/i.test(n.nodeValue)){var p=n.parentNode;if(p&&!SKIP.test(p.nodeName)){var v=limpia(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}}}
  function arbol(r){if(!r)return;if(r.nodeType===3){nodo(r);return;}if(r.nodeType!==1||SKIP.test(r.nodeName))return;
    if(!/upabase/i.test(r.textContent||'')&&!/upabase/i.test(r.title||''))return;
    if(/upabase/i.test(r.title||''))r.title=limpia(r.title);
    var w=document.createTreeWalker(r,4,null),t;while((t=w.nextNode()))nodo(t);
    Array.prototype.forEach.call(r.querySelectorAll('[title*="upabase"]'),function(e){e.title=limpia(e.title);});}
  if(/upabase/i.test(document.title))document.title=limpia(document.title);
  var pend=[],prog=false;
  function correr(){prog=false;var l=pend;pend=[];l.forEach(arbol);tira();unir();}
  function inicio(){arbol(document.body);tira();unir();
    new MutationObserver(function(ms){ms.forEach(function(m){if(m.type==='characterData')pend.push(m.target);else for(var i=0;i<m.addedNodes.length;i++)pend.push(m.addedNodes[i]);});
      if(!prog&&pend.length){prog=true;Promise.resolve().then(correr);}}).observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)inicio();else document.addEventListener('DOMContentLoaded',inicio);
}catch(e){}})();</script>
<!-- ===== fin lives-franja v2 ===== -->
</body>
</html>
