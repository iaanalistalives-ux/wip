<!-- ===== lives-actualizar v1 · 2026-10-06 · aviso de versión nueva (común a todas las herramientas).
     Revisa cada 3 minutos (y al volver a la pestaña) si el archivo publicado cambió. Si cambió,
     muestra "Hay una versión nueva · Actualizar". Nunca recarga sola: la persona decide, así no
     pierde lo que está llenando. Solo pide el encabezado del archivo (HEAD), no lo descarga. ===== -->
<style id="lsActCss">
#lsAct{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:2147483000;display:none;
  align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px);
  background:#0E3B36;color:#fff;border:2px solid #10B981;border-radius:12px;padding:10px 14px;
  box-shadow:0 8px 24px rgba(14,59,54,.30);font-family:Calibri,Arial,sans-serif;font-size:14px;line-height:1.35}
#lsAct b{font-weight:700}
#lsAct button{font-family:inherit;font-size:14px;font-weight:700;border-radius:8px;padding:8px 14px;cursor:pointer;min-height:38px}
#lsActSi{background:#10B981;color:#0E3B36;border:none}
#lsActNo{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55)}
@media print{#lsAct{display:none!important}}
</style>
<script id="lsActJs">(function(){
  'use strict';
  if (window.__lsAct) return; window.__lsAct = true;
  if (!/^https?:$/.test(location.protocol)) return;
  var url = location.origin + location.pathname, base = null, hasta = 0, mostrado = false;
  function firma(){
    return fetch(url, { method: 'HEAD', cache: 'no-store' }).then(function(r){
      if (!r.ok) return null;
      return r.headers.get('etag') || r.headers.get('last-modified') || null;
    }, function(){ return null; });
  }
  function aviso(){
    if (mostrado || Date.now() < hasta) return;
    var d = document.getElementById('lsAct');
    if (!d){
      d = document.createElement('div'); d.id = 'lsAct'; d.setAttribute('role', 'status');
      d.innerHTML = '<span><b>Hay una versión nueva de esta herramienta.</b> Guarda lo que estés haciendo y toca Actualizar.</span>' +
                    '<button id="lsActSi" type="button">Actualizar</button><button id="lsActNo" type="button">Después</button>';
      document.body.appendChild(d);
      document.getElementById('lsActSi').onclick = function(){ location.reload(); };
      document.getElementById('lsActNo').onclick = function(){ d.style.display = 'none'; mostrado = false; hasta = Date.now() + 10 * 60000; };
    }
    d.style.display = 'flex'; mostrado = true;
  }
  function revisar(){
    if (document.hidden) return;
    firma().then(function(f){
      if (!f) return;
      if (base === null){ base = f; return; }
      if (f !== base) aviso();
    });
  }
  revisar();
  setInterval(revisar, 3 * 60000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) revisar(); });
})();</script>
<!-- ===== fin lives-actualizar v1 ===== -->





<!-- ===== lives-franja v6 · 2026-10-09 · sin franja de estado arriba y sin la palabra "Supabase" (común a todas las herramientas).
     1) La tira de estado de arriba ("Datos al…", "En vivo…", nombre del usuario, fechas) y el aviso "Datos en vivo" NO se ven:
        el contenido empieza arriba del todo. Si la tira trae botones o enlaces (Volver, Atrás, Cambiar, navegación),
        solo quedan esos, en una línea delgada.
     2) Al terminar de cargar sale un aviso flotante "Actualizado · hh:mm" que desaparece solo (no ocupa espacio).
        Si la carga falla, sale un aviso rojo flotante con el motivo. Si el usuario solo puede consultar y la pantalla
        no lo dice en otro lado, sale un aviso flotante de solo consulta.
     3) En lo que se ve en pantalla no aparece el nombre del proveedor de la base: "· Supabase" y "fuente: Supabase" se quitan,
        y en los textos de ayuda "Supabase" se lee "la base de datos". El código, los guardados y los datos no cambian.
     4) v4 · Si la herramienta se abre dentro del portal LIVES antiguo y ese portal todavía es la versión vieja (sin el aviso
        de mudanza, bloque lsMudJs), se recarga el portal completo para que la persona vea el aviso de mudanza.
        Solo pasa al abrir la herramienta (todavía sin nada escrito), como máximo una vez cada 10 minutos;
        en el portal nuevo de Sistemas no hace nada.
     5) v5 · Botones de exportar, imprimir, actualizar, Excel o HTML que flotaban encima de la barra de filtros pasan a esa
        barra (si no hay barra, se crea una). La barra con filtros queda fija al bajar y, mientras está fija, los botones de
        acción se esconden; al subir vuelven. Las barras que solo tienen botones suben con la página.
        El dato "N registros · datos al …" ya no se muestra. Acabados no se toca.
     6) v6 · Los demás grupos de botones que flotaban arriba (pestañas como "Mejoras / Reporte", menús de vista,
        "Volver") también entran a la barra de filtros; si no hay barra, se les crea una. Al cambiar de pestaña, las
        pestañas pasan a la barra de la vista abierta. Lo que ya está dentro de una tarjeta no se mueve. Una barra de
        filtros muy alta (más de 180 px) no se queda fija, para no tapar media pantalla. ===== -->

<script id="lsFrJs">(function(){try{

  var PERM=/solo consulta|sin permiso|no tien[ea]s? permiso|solo para consultar|modo consulta|solo lectura/i;

      if(n.nodeType===3){if(n.nodeValue.trim()){var sp=document.createElement('span');sp.className='lsFrTx';c.insertBefore(sp,n);sp.appendChild(n);}}
      else if(n.nodeType===1&&!esCtlPropio(n)&&!n.classList.contains('lsFrTx')){if(esCtl(n))limpiaCont(n);else if(!n.classList.contains('lsFrOc'))n.classList.add('lsFrOc');}});}
  function ordenar(){var s=strip();if(!s)return;var vis=0;
    Array.prototype.forEach.call(s.children,function(e){
      if(esCtl(e)){if(e.classList.contains('lsFrOc'))e.classList.remove('lsFrOc');if(!esCtlPropio(e))limpiaCont(e);if(!oculto(e))vis++;}
      else if(!e.classList.contains('lsFrOc'))e.classList.add('lsFrOc');});

  /* 2) Avisos flotantes. */

    clearTimeout(tm);T.className=cls||'';T.innerHTML=html;void T.offsetWidth;T.classList.add('ver');
    if(cls==='err'){var x=document.createElement('span');x.className='x';x.textContent='✕';x.onclick=function(){T.classList.remove('ver');};T.appendChild(x);}

  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function textoEstado(){var s=strip(),t='';
    if(s)Array.prototype.forEach.call(s.querySelectorAll('.lsFrOc,.lsFrTx'),function(e){if(!oculto(e))t+=' '+(e.textContent||'');});
    return t.replace(/\s+/g,' ').trim();}
  var errMostrado='';
  function revisar(){
    var t=textoEstado(),av=document.querySelector('#avisoVivo,.avisoVivo');
    if(t&&ERR.test(t)){if(errMostrado!==t){errMostrado=t;toast('<b>Atención:</b> '+esc(t.slice(0,200)),'err');}return;}
    if(errMostrado){errMostrado='';if(T)T.classList.remove('ver');}
    if(!consDicho&&t&&PERM.test(t)){var cuerpo=document.body.innerText||'';
      if(!PERM.test(cuerpo)){consDicho=true;toast('<b>Solo consulta:</b> tu usuario puede ver esta pantalla, pero no registrar ni modificar.','cons',6000);return;}
      consDicho=true;}
    if(!listo){var cargando=(t&&CARGA.test(t))||(av&&!/\b(ok|error)\b/.test(av.className));
      if(document.readyState==='complete'&&(!cargando||Date.now()-t0>25000)){listo=true;
        if(av&&/\berror\b/.test(av.className))return;

  /* 3) Sin "Supabase" en lo visible. */
  var R=[[/\s*[·|,-]\s*fuente\s*:\s*Supabase\b/gi,''],[/\bfuente\s*:\s*Supabase\b\s*/gi,'Fuente: base de datos LIVES '],

  function limpia(t){var x=t;R.forEach(function(r){x=x.replace(r[0],r[1]);});return x.replace(/de la la base/gi,'de la base').replace(/en la la base/gi,'en la base');}
  var SKIP=/^(SCRIPT|STYLE|NOSCRIPT|TEXTAREA|CODE|PRE)$/;

    new MutationObserver(function(ms){var mio=true;ms.forEach(function(m){var n=m.target;if(!(T&&(n===T||T.contains(n))))mio=false;

<script id="lsBaJs">(function(){try{
  /* v6 · Botones de exportar, imprimir, actualizar y similares: van en la barra de filtros (no flotando arriba).
     Grupos de botones sueltos arriba (pestañas como "Mejoras / Reporte", "Volver", menús de vista) también
     entran a la barra de filtros; si la pantalla no tiene barra, se les crea una. Al cambiar de pestaña,
     las pestañas pasan a la barra de la vista que queda abierta.
     La barra con filtros queda fija al bajar (si no es muy alta); los botones de acción se esconden mientras
     está fija y vuelven al subir. El dato de "N registros · datos al …" no se muestra.
     No cambia cálculos, datos ni guardados: solo ubica botones que ya existen. Acabados (Lady) no se toca. */
  if(/\/formulario-acabados\//.test(location.pathname))return;
  var SIN_GRUPOS=/\/Tienda-lives\/(index\.html)?$/i.test(location.pathname);
  var ACC=/^(exportar|descargar|imprimir|actualizar|recargar|compartir|copiar enlace)\b|\b(excel|pdf|html|csv)\b/i;
  var EST=/(datos al \d|le[ií]d[oa]s? a las|datos de las \d|actualizad[oa] a las|[uú]ltima (lectura|actualizaci)|datos en vivo|en vivo ·)/i;
  var BARRA='.bar,.toolbar,.filtros,.filters,.fbar,.filterbar,.barra,.controles,.controls,.fbarra,.fpanel,[class*="barra"]:not(.lsSinBarra):not(.lsBarra),[class*="filtro"],[class*="filter"],[class*="toolbar"]';
  var CTL='select,input:not([type=hidden]):not([type=file]):not([type=button]):not([type=submit])';
  var FUERA='dialog,[role=dialog],.modal,.ficha-card,.mbox,.ventana,#lsFrToast,#lsAct,#lsMud,.lsSinBarra';
  var ALTO_FIJO=180;
  function vis(e){if(!e||!e.getBoundingClientRect)return false;var r=e.getBoundingClientRect();if(r.width<=0||r.height<=0)return false;var s=getComputedStyle(e);return s.visibility!=='hidden'&&s.display!=='none';}
  function txt(e){return (e.textContent||'').replace(/\s+/g,' ').trim();}
  function limpio(t){return t.replace(/^[^A-Za-zÁÉÍÓÚáéíóúÑñ0-9]+/,'');}
  function esAcc(b){if(b.closest('#lsFrToast,#lsAct,#lsMud,.lsSinBarra .lsFrOc'))return false;var t=limpio(txt(b));return t.length>0&&t.length<40&&ACC.test(t);}
  function poner(e,c){if(!e.classList.contains(c))e.classList.add(c);}
  function hayCtl(e){return Array.prototype.some.call(e.querySelectorAll('a,button,'+CTL+',textarea,canvas,img,table,svg'),vis);}
  function enBarra(e){var b=e.closest(BARRA);return b&&!b.closest('.lsSinBarra')?b:null;}
  function externa(b){var p=b.parentElement&&b.parentElement.closest(BARRA);while(p&&!p.closest('.lsSinBarra')&&vis(p)){b=p;p=b.parentElement&&b.parentElement.closest(BARRA);}return b;}
  function barraFiltros(){var c=Array.prototype.filter.call(document.querySelectorAll(BARRA),function(b){return vis(b)&&!b.closest(FUERA)&&!b.closest('.modal:not(.on):not(.show):not(.abierto)')&&Array.prototype.some.call(b.querySelectorAll(CTL),vis);}).map(externa);
    c.sort(function(a,b){return a.getBoundingClientRect().top-b.getBoundingClientRect().top;});return c[0]||null;}
  function contScroll(e){var p=e.parentElement;while(p&&p!==document.body){var o=getComputedStyle(p).overflowY;if(o==='auto'||o==='scroll')return p;p=p.parentElement;}return null;}
  /* ¿todo lo que se ve dentro de e son botones o enlaces? (sin campos, tablas, gráficos ni texto suelto) */
  function soloBotones(e){
    if(e.querySelector(CTL+',textarea,table,canvas,iframe,video'))return false;
    var w=document.createTreeWalker(e,NodeFilter.SHOW_TEXT,null,false),n;
    while((n=w.nextNode())){if(!n.nodeValue.trim())continue;var p=n.parentElement;if(!p||!vis(p))continue;if(!p.closest('button,a,[role=tab]'))return false;}
    return Array.prototype.some.call(e.querySelectorAll('button,a,[role=tab]'),vis);}
  function grupoDe(b){
    var g=b,p=b.parentElement;
    while(p&&p!==document.body&&!p.matches(BARRA)&&!p.matches('main,header,section,article,form,.wrap,.container,.contenedor')&&soloBotones(p)&&p.getBoundingClientRect().height<90){g=p;p=p.parentElement;}
    if(g===b){var q=b.parentElement;if(!q||!soloBotones(q))return null;}
    return g;}
  /* ¿e ya está dentro de una tarjeta o caja con fondo o borde? entonces no está "en el aire" */
  function enCaja(e){var fondo=getComputedStyle(document.body).backgroundColor,p=e.parentElement;
    while(p&&p!==document.body&&p!==document.documentElement){var s=getComputedStyle(p);
      var bg=s.backgroundColor;if(bg&&bg!=='rgba(0, 0, 0, 0)'&&bg!=='transparent'&&bg!==fondo)return true;
      if(parseFloat(s.borderTopWidth)>0&&s.borderTopStyle!=='none'&&parseFloat(s.borderLeftWidth)>0)return true;
      if(s.boxShadow&&s.boxShadow!=='none')return true;p=p.parentElement;}
    return false;}
  var F=null,FIX=null,MOV=[];
  function cajaTop(f){var c=f.querySelector(':scope > .lsTop');if(!c){c=document.createElement('div');c.className='lsTop';f.insertBefore(c,f.firstChild);}return c;}
  function aCasa(m){if(!m.bar){m.bar=document.createElement('div');m.bar.className='lsBarra';m.casa.parentNode.insertBefore(m.bar,m.casa.nextSibling);}
    if(m.g.parentNode!==m.bar)m.bar.appendChild(m.g);m.bar.style.display='';}
  function ubicar(m,f){

  function arreglar(){

    /* 1) dato de estado arriba */
    Array.prototype.forEach.call(document.querySelectorAll('div,span,p,small'),function(e){
      if(e.classList.contains('lsBaOc')||e.children.length>3||!vis(e))return;var t=txt(e);
      if(t.length>160||!EST.test(t)||hayCtl(e))return;if(e.getBoundingClientRect().top>tope+4)return;
      if(e.closest('.lsAcc,.lsBarra,.lsTop,'+BARRA))return;poner(e,'lsBaOc');});
    /* 0) grupos ya movidos que quedaron escondidos (cambio de pestaña): pasan a la barra visible o vuelven a su sitio */
    MOV.forEach(function(m){if(!vis(m.g)||(f&&m.bar&&m.g.parentNode===m.bar))ubicar(m,f);});
    /* 2) botones de exportar/imprimir/actualizar flotando encima de la barra */
    var sueltos=Array.prototype.filter.call(document.querySelectorAll('button,a.btn,a[class*="btn"]'),function(b){
      if(!vis(b)||!esAcc(b)||b.closest('.lsAcc,.lsBarra,.lsTop'))return false;if(f&&f.contains(b))return false;

      sueltos.forEach(function(b){var antes=b.parentElement;caja.appendChild(b);
        var p=antes,n=0;while(p&&p!==document.body&&n<4){if(p.contains(dest))break;if(!hayCtl(p)&&p.getBoundingClientRect().height<140){poner(p,'lsBaOc');p=p.parentElement;n++;}else break;}});
    }

    if(!SIN_GRUPOS){
      var lim=f?f.getBoundingClientRect().top:220,vistos=[];
      Array.prototype.forEach.call(document.querySelectorAll('button,a,[role=tab]'),function(b){
        if(!vis(b)||!txt(b)||b.closest('.lsAcc,.lsBarra,.lsTop,aside,nav,[class*="side"],[class*="menu"],form,table,'+FUERA))return;
        if(f&&f.contains(b))return;if(enBarra(b))return;

        var r=b.getBoundingClientRect();if(r.bottom>lim+2||r.top>320)return;
        var g=grupoDe(b);if(!g||vistos.indexOf(g)>=0)return;if(enCaja(g))return;
        if(g.closest('aside,nav,[class*="side"],[class*="menu"],'+FUERA))return;
        vistos.push(g);});
      vistos.forEach(function(g){if(MOV.some(function(m){return m.g===g;}))return;
        var casa=document.createElement('span');casa.className='lsCasa';casa.style.display='none';g.parentNode.insertBefore(casa,g);
        var m={g:g,casa:casa,bar:null};MOV.push(m);ubicar(m,f);});
    }
    /* 3) barra con filtros fija (si no es muy alta); botones de acción marcados para esconderse mientras está fija */
    if(f){
      Array.prototype.forEach.call(f.querySelectorAll('button,a'),function(b){if(esAcc(b))poner(b,'lsAccBtn');});
      var alta=f.getBoundingClientRect().height>ALTO_FIJO;
      if(alta){f.classList.remove('lsBaFijo');f.classList.remove('lsPegada');F=null;}
      else{
        if(getComputedStyle(f).position==='static'){poner(f,'lsBaFijo');var bg=getComputedStyle(f).backgroundColor;if(!bg||bg==='rgba(0, 0, 0, 0)'||bg==='transparent')f.style.backgroundColor=getComputedStyle(document.body).backgroundColor||'#F1F6F4';}
        F=f;FIX=contScroll(f);}
    }
    /* barras pegajosas que solo tienen botones (sin filtros): que suban con la página */
    Array.prototype.forEach.call(document.querySelectorAll(BARRA),function(b){if(b===f||!vis(b))return;var s=getComputedStyle(b).position;
      if((s==='sticky'||s==='fixed')&&!Array.prototype.some.call(b.querySelectorAll(CTL),vis)&&Array.prototype.some.call(b.querySelectorAll('button,a'),esAcc))poner(b,'lsBaSuelta');});
    pegada();
  }
  function pegada(){if(!F||!F.isConnected)return;var top=parseFloat(getComputedStyle(F).top)||0,base=FIX?FIX.getBoundingClientRect().top:0,desp=FIX?FIX.scrollTop:(window.scrollY||document.documentElement.scrollTop);
    var en=desp>4&&(F.getBoundingClientRect().top-base)<=top+1.5;if(en!==F.classList.contains('lsPegada'))F.classList.toggle('lsPegada',en);}
  document.addEventListener('scroll',function(){pegada();},true);window.addEventListener('resize',function(){pegada();luego();});
  document.addEventListener('click',function(){setTimeout(function(){try{arreglar();}catch(e){}},30);},true);
  var t=null;function luego(){if(t)return;t=setTimeout(function(){t=null;try{arreglar();}catch(e){}},250);}
  function inicio(){luego();new MutationObserver(function(ms){for(var i=0;i<ms.length;i++){if(ms[i].addedNodes.length||ms[i].removedNodes.length){luego();return;}}}).observe(document.body,{childList:true,subtree:true});
    window.addEventListener('load',luego);var k=0,iv=setInterval(function(){luego();if(++k>20)clearInterval(iv);},700);}
  if(document.body)inicio();else document.addEventListener('DOMContentLoaded',inicio);
  window.__lsBa={arreglar:arreglar,MOV:MOV,F:function(){return F;},bf:barraFiltros};
}catch(e){}})();</script>
